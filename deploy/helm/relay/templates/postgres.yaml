{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relay-postgres-data
  namespace: {{ include "relay.namespace" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.postgres.storageClass }}
  storageClassName: {{ .Values.postgres.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay-postgres
  namespace: {{ include "relay.namespace" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  serviceName: relay-postgres
  replicas: 1
  selector:
    matchLabels: { app: relay-postgres }
  template:
    metadata:
      labels: { app: relay-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432, name: pg }]
          env:
            - name: POSTGRES_DB
              value: relay
            - name: POSTGRES_USER
              value: relay
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: relay-secrets, key: POSTGRES_PASSWORD, optional: true }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "relay"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: relay-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: relay-postgres
  namespace: {{ include "relay.namespace" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
spec:
  ports:  [{ port: 5432, targetPort: pg, name: pg }]
  selector: { app: relay-postgres }
  type: ClusterIP
{{- end }}
