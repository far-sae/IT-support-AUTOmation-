{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-default-deny
  namespace: {{ include "relay.namespace" . }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-client
  namespace: {{ include "relay.namespace" . }}
spec:
  podSelector: { matchLabels: { app: relay-client } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-server
  namespace: {{ include "relay.namespace" . }}
spec:
  podSelector: { matchLabels: { app: relay-server } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - podSelector:        { matchLabels: { app: relay-client } }
      ports: [{ port: 4000 }]
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay-postgres
  namespace: {{ include "relay.namespace" . }}
spec:
  podSelector: { matchLabels: { app: relay-postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: relay-server } }
      ports: [{ port: 5432 }]
{{- end }}
{{- end }}
