# Single-node Postgres for demos / dev / small prod. For real production
# switch to a managed offering (RDS, Cloud SQL) and delete this file.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relay-postgres-data
  namespace: relay
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: relay-postgres
  namespace: relay
spec:
  serviceName: relay-postgres
  replicas: 1
  selector:
    matchLabels: { app: relay-postgres }
  template:
    metadata:
      labels: { app: relay-postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432, name: pg }]
          env:
            - name: POSTGRES_DB
              value: relay
            - name: POSTGRES_USER
              value: relay
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: relay-secrets, key: POSTGRES_PASSWORD, optional: true }
          # Fallback for first boot when the secret key isn't set —
          # rotated after `kubectl exec`'d ALTER USER.
          args: []
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "relay"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: relay-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: relay-postgres
  namespace: relay
spec:
  ports:  [{ port: 5432, targetPort: pg, name: pg }]
  selector: { app: relay-postgres }
  type: ClusterIP
