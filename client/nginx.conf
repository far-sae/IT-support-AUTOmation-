# Serves the SPA + proxies /api + /socket.io to the server container.
#
# In docker-compose, the server is reachable as the hostname "server"
# inside the user-defined bridge network.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;
  gzip_min_length 1024;

  # API proxy
  location /api/ {
    proxy_pass         http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Socket.io (websocket upgrade)
  location /socket.io/ {
    proxy_pass         http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_read_timeout 86400;
  }

  # SPA fallback — every non-file route returns index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
