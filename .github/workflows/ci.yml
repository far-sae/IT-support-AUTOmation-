name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://relay:relay@localhost:5432/relay?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace server

      - name: Apply pending migrations
        run: npm run prisma:deploy --workspace server

      - name: Run server tests
        run: npm test --workspace server

      - name: Lint (server)
        run: npm run lint --workspace server || true
        # Lint warnings don't fail the build; eslint config is permissive.

      - name: Build client (Vite)
        run: npm run build --workspace client

  build-images:
    name: Build Docker images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pushing is disabled by default. To enable:
      #   1. Set DOCKER_PUSH=true in repo secrets/vars
      #   2. Configure DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (or any registry creds)
      #   3. Add a docker/login-action step here

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: relay-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: false
          tags: relay-client:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
