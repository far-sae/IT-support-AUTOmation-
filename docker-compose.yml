# Relay — full stack for local development.
#
#   docker compose up --build
#
# Then:
#   • App         → http://localhost:5173
#   • Public status → http://localhost:5173/status
#   • API direct  → http://localhost:4000
#   • Mailpit UI  → http://localhost:8025  (outbound mail is captured here)
#   • MinIO UI    → http://localhost:9001  (login: relayminio / relayminio)
#
# After the stack is up, optionally seed the demo data with:
#   docker compose exec server npm run seed

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: relayminio
      MINIO_ROOT_PASSWORD: relayminio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://relay:relay@postgres:5432/relay?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-please-change-me-please}
      JWT_EXPIRES_IN: 7d

      USE_AI_TRIAGE: ${USE_AI_TRIAGE:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: "Relay Support <support@relay.local>"

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      OAUTH_CALLBACK_BASE_URL: http://localhost:4000

      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: relay-attachments
      S3_ACCESS_KEY: relayminio
      S3_SECRET_KEY: relayminio
      S3_FORCE_PATH_STYLE: "true"

      SLA_CHECK_INTERVAL_MINUTES: 5
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_started

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server

  # Phase 11 — observability stack.
  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - server

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
